<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Forêt &amp; Chasse</title>
<link rel="stylesheet" href="css/style.css">
<style>
    body { display: flex; flex-direction: column; min-height: 100vh; padding: 0 0 16px 0; }
    body > .sans-impression { align-self: stretch; }
    .boite-connexion { max-width: 380px; width: calc(100% - 32px); margin: auto; }
    .boite-connexion h1 { font-size: 20px; margin-bottom: 2px; }
    .boite-connexion p.sous-titre { color: #6b6b60; font-size: 13px; margin-top: 0; margin-bottom: 20px; }
</style>
<link rel="icon" type="image/svg+xml" href="img/logo-bois.svg">
<link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2d3b2d">
</head>
<body>

<div class="boite-connexion carte">
    <img src="img/logo-bois-complet.svg" alt="Forêt &amp; Chasse, Sologne" class="logo-connexion">
    <p class="sous-titre">Gestion de propriété forestière, connexion</p>

    <div id="zone-message"></div>

    <form id="formulaire-connexion">
        <label class="etiquette" for="champ-email">Identifiant (email du compte partagé)</label>
        <input type="email" id="champ-email" required autocomplete="username">

        <label class="etiquette" for="champ-mot-de-passe">Mot de passe</label>
        <input type="password" id="champ-mot-de-passe" required autocomplete="current-password">

        <button type="submit" class="bouton bouton-principal" style="width:100%; margin-top:18px;">
            Se connecter
        </button>
    </form>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/mode-demo.js"></script>
<script src="js/supabase-client.js"></script>
<script>
    afficherBandeauDemoSiBesoin();
    if (modeDemonstrationActif()) {
        document.getElementById("champ-email").value = COMPTE_DEMO.email;
        document.getElementById("champ-mot-de-passe").value = COMPTE_DEMO.motDePasse;
    }

    // Si déjà connecté, inutile de repasser par l'écran de connexion.
    (async () => {
        const { data } = await clientSupabase.auth.getSession();
        if (data.session) {
            window.location.href = "pages/battues.html";
        }
    })();

    document.getElementById("formulaire-connexion").addEventListener("submit", async (evenement) => {
        evenement.preventDefault();
        const zoneMessage = document.getElementById("zone-message");
        zoneMessage.innerHTML = "";

        const email = document.getElementById("champ-email").value.trim();
        const motDePasse = document.getElementById("champ-mot-de-passe").value;

        const { error } = await clientSupabase.auth.signInWithPassword({ email, password: motDePasse });

        if (error) {
            zoneMessage.innerHTML = `<div class="message-alerte">Connexion refusée : ${error.message}</div>`;
            return;
        }

        window.location.href = "pages/battues.html";
    });
</script>

</body>
</html>
