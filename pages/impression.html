<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impression — Forêt &amp; Chasse</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/impression.css">
</head>
<body>

<div id="zone-navigation" class="ib-hors-impression"></div>

<main class="contenu contenu-large">
    <div class="entete-page ib-hors-impression">
        <div>
            <h1 id="titre-page">Impression</h1>
            <p class="sous-titre" id="sous-titre-page"></p>
        </div>
        <div class="barre-outils" style="margin:0;">
            <a id="lien-plan" href="#" class="bouton bouton-secondaire">← Retour au plan</a>
            <a id="lien-carton" href="#" class="bouton bouton-secondaire">Cartons A5</a>
            <a id="lien-fiche" href="#" class="bouton bouton-secondaire">Fiche de gestion A4</a>
            <button id="bouton-imprimer" class="bouton bouton-principal">Imprimer</button>
        </div>
    </div>

    <div id="zone-chargement" class="message-chargement ib-hors-impression">Chargement…</div>

    <div id="zone-contenu" style="display:none;">
        <div class="ib-ecran">
            <aside class="ib-panneau ib-hors-impression" id="panneau"></aside>

            <div class="ib-apercu-zone">
                <div id="alerte-debordement" class="ib-alerte-debordement ib-hors-impression" style="display:none;"></div>
                <p id="aide-impression" class="ib-hors-impression" style="font-size:12px; color:#6b6b60; margin:0 0 8px 0;"></p>
                <div id="apercu" class="ib-apercu-boite">
                    <div id="echelle" class="ib-echelle"><div id="racine" class="ib-racine"></div></div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/mode-demo.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/auth.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/fonds-carte.js"></script>
<script src="../js/dessin-carte.js"></script>
<script src="../js/categories.js"></script>
<script src="../js/impression-blocs.js"></script>
<script src="../js/impression.js"></script>
</body>
</html>
