<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saisie rapide — Forêt &amp; Chasse</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/svg+xml" href="../img/logo-bois.svg">
<link rel="icon" type="image/png" sizes="48x48" href="../img/favicon-48.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#2d3b2d">
</head>
<body class="page-saisie">

<div id="zone-navigation"></div>

<main class="contenu">
    <div id="zone-chargement" class="message-chargement">Chargement…</div>

    <div id="zone-saisie" style="display:none;">
        <div class="saisie-entete">
            <div>
                <h1 id="saisie-titre">Saisie rapide</h1>
                <div id="saisie-sous-titre" class="saisie-sous-titre"></div>
            </div>
            <div id="saisie-etat" class="saisie-etat"></div>
        </div>
        <div id="saisie-message"></div>

        <section class="saisie-bloc">
            <h2><span>1</span> Où ?</h2>
            <div id="saisie-traques" class="saisie-defilement"></div>
            <div id="saisie-postes" class="saisie-postes"></div>
        </section>

        <section class="saisie-bloc">
            <h2><span>2</span> Quel animal ? <small>un appui = un animal</small></h2>
            <div id="saisie-categories" class="saisie-grille"></div>
            <details id="saisie-autres" class="saisie-autres" style="display:none;">
                <summary>Autre gibier</summary>
                <div id="saisie-categories-autres" class="saisie-grille"></div>
            </details>
        </section>

        <section class="saisie-bloc">
            <h2><span>3</span> Derniers enregistrés</h2>
            <div id="saisie-derniers"></div>
        </section>

        <section class="saisie-bloc">
            <h2>Bilan de la journée</h2>
            <div id="saisie-bilan"></div>
        </section>

        <section class="saisie-bloc">
            <h2>Envoyer au PC</h2>
            <p style="margin:0 0 10px 0; font-size:14px; color:#555;">Crée un lien à t'envoyer par message ou courriel : ouvert sur le PC, il ajoute à la battue ce qui a été noté ici.</p>
            <button type="button" class="bouton bouton-principal" style="min-height:48px; width:100%;" onclick="ouvrirEchange()">Créer le lien d'échange</button>
        </section>
    </div>
</main>

<div id="saisie-toast" class="saisie-toast" style="display:none;"></div>

<!-- Choix d'une précision (ex : chevreuil, chevrette) -->
<div class="fond-modale" id="modale-precision">
    <div class="boite-modale">
        <h2 id="titre-precision">Précision</h2>
        <div id="choix-precision" class="saisie-grille"></div>
        <div class="actions-modale">
            <button type="button" class="bouton bouton-secondaire" onclick="fermerModale('modale-precision')">Annuler</button>
        </div>
    </div>
</div>

<!-- Lien d'échange vers le PC -->
<div class="fond-modale" id="modale-echange">
    <div class="boite-modale">
        <h2>Lien d'échange</h2>
        <div id="resume-echange" style="font-size:14px; margin-bottom:8px;"></div>
        <label class="etiquette" style="font-weight:400;"><input type="checkbox" id="case-plan-echange"> Inclure aussi le plan (traques, tracés, postes) <small style="color:#888;">: lien beaucoup plus long</small></label>
        <label class="etiquette">Lien</label>
        <textarea id="champ-lien-echange" rows="4" readonly style="font-size:12px;" onclick="this.select()"></textarea>
        <div id="taille-echange" style="font-size:12px; color:#6b6b60; margin:4px 0 8px 0;"></div>
        <div class="saisie-grille" style="grid-template-columns:1fr 1fr;">
            <button type="button" class="bouton bouton-principal" id="bouton-partager" style="min-height:48px; display:none;">Partager…</button>
            <button type="button" class="bouton bouton-principal" id="bouton-copier" style="min-height:48px;">Copier le lien</button>
            <button type="button" class="bouton bouton-secondaire" id="bouton-fichier" style="min-height:48px;">Enregistrer un fichier</button>
        </div>
        <div id="message-echange" style="margin-top:8px; font-size:13px;"></div>
        <div class="actions-modale">
            <button type="button" class="bouton bouton-secondaire" onclick="fermerModale('modale-echange')">Fermer</button>
        </div>
    </div>
</div>

<!-- Détails d'un prélèvement -->
<div class="fond-modale" id="modale-detail">
    <div class="boite-modale">
        <h2 id="titre-detail">Détails</h2>
        <div id="message-detail"></div>
        <form id="formulaire-detail">
            <div class="ligne-champs">
                <div><label class="etiquette">Sexe</label>
                    <select id="champ-sexe-detail"><option>Indéterminé</option><option>Mâle</option><option>Femelle</option></select></div>
                <div><label class="etiquette">Poids (kg)</label><input type="number" step="0.1" min="0" id="champ-poids-detail" inputmode="decimal"></div>
            </div>
            <label class="etiquette">Chasseur</label>
            <select id="champ-chasseur-detail"></select>
            <label class="etiquette">Précision, commentaire</label>
            <input type="text" id="champ-commentaire-detail" placeholder="ex : chevrette, blessé retrouvé">
            <div class="actions-modale">
                <button type="button" class="bouton bouton-danger" id="bouton-supprimer-detail">Supprimer</button>
                <span class="espace"></span>
                <button type="button" class="bouton bouton-secondaire" onclick="fermerModale('modale-detail')">Annuler</button>
                <button type="submit" class="bouton bouton-principal">Enregistrer</button>
            </div>
        </form>
    </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/mode-demo.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/modales.js"></script>
<script src="../js/categories.js"></script>
<script src="../js/echange.js"></script>
<script src="../js/saisie.js"></script>
</body>
</html>
