<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finances — Forêt &amp; Chasse</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="zone-navigation"></div>

<main class="contenu">
    <div class="entete-page">
        <div>
            <h1>Finances et documents</h1>
            <p class="sous-titre">Cotisations, factures, baux de chasse et documents</p>
        </div>
    </div>

    <div class="onglets">
        <button class="actif" data-onglet="onglet-cotisations">Cotisations</button>
        <button data-onglet="onglet-factures">Factures</button>
        <button data-onglet="onglet-baux">Baux de chasse</button>
        <button data-onglet="onglet-documents">Documents</button>
    </div>

    <div class="panneau-onglet actif" id="onglet-cotisations">
        <div class="barre-outils"><span class="espace"></span>
            <button class="bouton bouton-principal" onclick="ouvrirCreationCotisation()">Nouvelle cotisation</button>
        </div>
        <div class="carte">
            <table class="tableau-donnees">
                <thead><tr><th>Chasseur</th><th>Saison</th><th>Montant</th><th>Statut</th><th></th></tr></thead>
                <tbody id="corps-tableau-cotisations"></tbody>
            </table>
        </div>
    </div>

    <div class="panneau-onglet" id="onglet-factures">
        <div class="barre-outils"><span class="espace"></span>
            <button class="bouton bouton-principal" onclick="ouvrirCreationFacture()">Nouvelle facture</button>
        </div>
        <div class="carte">
            <table class="tableau-donnees">
                <thead><tr><th>Numéro</th><th>Description</th><th>Montant</th><th>Échéance</th><th>Statut</th><th></th></tr></thead>
                <tbody id="corps-tableau-factures"></tbody>
            </table>
        </div>
    </div>

    <div class="panneau-onglet" id="onglet-baux">
        <div class="barre-outils"><span class="espace"></span>
            <button class="bouton bouton-principal" onclick="ouvrirCreationBail()">Nouveau bail</button>
        </div>
        <div class="carte">
            <table class="tableau-donnees">
                <thead><tr><th>Locataire</th><th>Début</th><th>Fin</th><th>Montant annuel</th><th></th></tr></thead>
                <tbody id="corps-tableau-baux"></tbody>
            </table>
        </div>
    </div>

    <div class="panneau-onglet" id="onglet-documents">
        <div class="barre-outils"><span class="espace"></span>
            <button class="bouton bouton-principal" onclick="ouvrirAjoutDocument()">Ajouter un document</button>
        </div>
        <div class="carte">
            <table class="tableau-donnees">
                <thead><tr><th>Titre</th><th>Type</th><th>Rattaché à</th><th></th></tr></thead>
                <tbody id="corps-tableau-documents"></tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modale Cotisation -->
<div class="fond-modale" id="modale-cotisation">
    <div class="boite-modale">
        <h2>Cotisation</h2>
        <div id="message-modale-cotisation"></div>
        <form id="formulaire-cotisation">
            <label class="etiquette">Chasseur *</label><select id="champ-chasseur-cotisation" required></select>
            <div class="ligne-champs">
                <div><label class="etiquette">Saison *</label><input type="text" id="champ-saison-cotisation" required></div>
                <div><label class="etiquette">Montant (€) *</label><input type="number" min="0" step="0.01" id="champ-montant-cotisation" required></div>
            </div>
            <label class="etiquette">Statut</label>
            <select id="champ-statut-cotisation">
                <option>En attente</option><option>Payée</option><option>En retard</option><option>Annulée</option>
            </select>
            <div class="actions-modale">
                <button type="button" class="bouton bouton-secondaire" onclick="fermerModale('modale-cotisation')">Annuler</button>
                <button type="submit" class="bouton bouton-principal">Enregistrer</button>
            </div>
        </form>
    </div>
</div>

<!-- Modale Facture -->
<div class="fond-modale" id="modale-facture">
    <div class="boite-modale">
        <h2>Facture</h2>
        <div id="message-modale-facture"></div>
        <form id="formulaire-facture">
            <div class="ligne-champs">
                <div><label class="etiquette">Numéro</label><input type="text" id="champ-numero-facture"></div>
                <div><label class="etiquette">Montant (€) *</label><input type="number" min="0" step="0.01" id="champ-montant-facture" required></div>
            </div>
            <label class="etiquette">Description</label><input type="text" id="champ-description-facture">
            <div class="ligne-champs">
                <div><label class="etiquette">Date d'émission</label><input type="date" id="champ-emission-facture"></div>
                <div><label class="etiquette">Échéance</label><input type="date" id="champ-echeance-facture"></div>
            </div>
            <label class="etiquette">Statut</label>
            <select id="champ-statut-facture">
                <option>En attente</option><option>Payée</option><option>En retard</option><option>Annulée</option>
            </select>
            <label class="etiquette">Chantier lié</label><select id="champ-chantier-facture"></select>
            <label class="etiquette">Prestataire lié</label><select id="champ-prestataire-facture"></select>
            <div class="actions-modale">
                <button type="button" class="bouton bouton-secondaire" onclick="fermerModale('modale-facture')">Annuler</button>
                <button type="submit" class="bouton bouton-principal">Enregistrer</button>
            </div>
        </form>
    </div>
</div>

<!-- Modale Bail -->
<div class="fond-modale" id="modale-bail">
    <div class="boite-modale">
        <h2>Bail de chasse</h2>
        <div id="message-modale-bail"></div>
        <form id="formulaire-bail">
            <label class="etiquette">Locataire *</label><input type="text" id="champ-locataire-bail" required>
            <label class="etiquette">Parcelles concernées</label><textarea id="champ-perimetre-bail" rows="2"></textarea>
            <div class="ligne-champs">
                <div><label class="etiquette">Début</label><input type="date" id="champ-debut-bail"></div>
                <div><label class="etiquette">Fin</label><input type="date" id="champ-fin-bail"></div>
            </div>
            <label class="etiquette">Montant annuel (€)</label><input type="number" min="0" step="0.01" id="champ-montant-bail">
            <div class="actions-modale">
                <button type="button" class="bouton bouton-secondaire" onclick="fermerModale('modale-bail')">Annuler</button>
                <button type="submit" class="bouton bouton-principal">Enregistrer</button>
            </div>
        </form>
    </div>
</div>

<!-- Modale Document -->
<div class="fond-modale" id="modale-document">
    <div class="boite-modale">
        <h2>Ajouter un document</h2>
        <div id="message-modale-document"></div>
        <form id="formulaire-document">
            <label class="etiquette">Titre *</label><input type="text" id="champ-titre-document" required>
            <label class="etiquette">Type</label>
            <select id="champ-type-document">
                <option>Bail de chasse</option><option>Contrat</option><option>Facture</option>
                <option>Photo</option><option>Plan / carte</option><option>Autre</option>
            </select>
            <label class="etiquette">Fichier *</label>
            <input type="file" id="champ-fichier-document" required>
            <label class="etiquette">Rattacher à une parcelle</label><select id="champ-parcelle-document"></select>
            <label class="etiquette">Rattacher à un chantier</label><select id="champ-chantier-document"></select>
            <label class="etiquette">Rattacher à un chasseur</label><select id="champ-chasseur-document"></select>
            <div class="actions-modale">
                <button type="button" class="bouton bouton-secondaire" onclick="fermerModale('modale-document')">Annuler</button>
                <button type="submit" class="bouton bouton-principal">Enregistrer</button>
            </div>
        </form>
    </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/mode-demo.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/modales.js"></script>
<script src="../js/onglets.js"></script>
<script src="../js/finances.js"></script>
</body>
</html>
