<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chasse — Forêt &amp; Chasse</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="zone-navigation"></div>

<main class="contenu">
    <div class="entete-page">
        <div>
            <h1>Gestion de la chasse</h1>
            <p class="sous-titre">Chasseurs, plan de chasse, battues et carnet de prélèvements</p>
        </div>
    </div>

    <div class="onglets">
        <button class="actif" data-onglet="onglet-chasseurs">Chasseurs</button>
        <button data-onglet="onglet-plan">Plan de chasse</button>
        <button data-onglet="onglet-battues">Battues</button>
        <button data-onglet="onglet-prelevements">Prélèvements</button>
    </div>

    <!-- Onglet Chasseurs -->
    <div class="panneau-onglet actif" id="onglet-chasseurs">
        <div class="barre-outils"><span class="espace"></span>
            <button class="bouton bouton-principal" onclick="ouvrirCreationChasseur()">Nouveau chasseur</button>
        </div>
        <div class="carte">
            <table class="tableau-donnees">
                <thead><tr><th>Nom</th><th>Téléphone</th><th>N° permis</th><th>Assurance</th><th>Statut</th><th></th></tr></thead>
                <tbody id="corps-tableau-chasseurs"></tbody>
            </table>
        </div>
    </div>

    <!-- Onglet Plan de chasse -->
    <div class="panneau-onglet" id="onglet-plan">
        <div class="barre-outils"><span class="espace"></span>
            <button class="bouton bouton-principal" onclick="ouvrirCreationPlan()">Nouvelle attribution</button>
        </div>
        <div class="carte">
            <table class="tableau-donnees">
                <thead><tr><th>Saison</th><th>Espèce</th><th>Attribution</th><th>Réalisé</th><th></th></tr></thead>
                <tbody id="corps-tableau-plan"></tbody>
            </table>
        </div>
    </div>

    <!-- Onglet Battues -->
    <div class="panneau-onglet" id="onglet-battues">
        <div class="barre-outils"><span class="espace"></span>
            <button class="bouton bouton-principal" onclick="ouvrirCreationBattue()">Nouvelle battue</button>
        </div>
        <div class="carte">
            <table class="tableau-donnees">
                <thead><tr><th>Date</th><th>Secteur</th><th>Responsable</th><th>Participants</th><th>Traques</th><th></th></tr></thead>
                <tbody id="corps-tableau-battues"></tbody>
            </table>
        </div>
    </div>

    <!-- Onglet Prélèvements -->
    <div class="panneau-onglet" id="onglet-prelevements">
        <div class="barre-outils"><span class="espace"></span>
            <button class="bouton bouton-principal" onclick="ouvrirCreationPrelevement()">Nouveau prélèvement</button>
        </div>
        <div class="carte">
            <table class="tableau-donnees">
                <thead><tr><th>Date</th><th>Espèce</th><th>Chasseur</th><th>Sexe</th><th>Poids</th><th></th></tr></thead>
                <tbody id="corps-tableau-prelevements"></tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modale Chasseur -->
<div class="fond-modale" id="modale-chasseur">
    <div class="boite-modale">
        <h2 id="titre-modale-chasseur">Chasseur</h2>
        <div id="message-modale-chasseur"></div>
        <form id="formulaire-chasseur">
            <label class="etiquette">Nom *</label><input type="text" id="champ-nom-chasseur" required>
            <label class="etiquette">Prénom</label><input type="text" id="champ-prenom-chasseur">
            <div class="ligne-champs">
                <div><label class="etiquette">Téléphone</label><input type="text" id="champ-telephone-chasseur"></div>
                <div><label class="etiquette">N° de permis</label><input type="text" id="champ-permis-chasseur"></div>
            </div>
            <label class="etiquette">Date d'adhésion</label><input type="date" id="champ-adhesion-chasseur">
            <div class="ligne-champs">
                <div><label class="etiquette">Assurance de chasse (assureur)</label><input type="text" id="champ-assureur-chasseur" placeholder="ex : Groupama"></div>
                <div><label class="etiquette">N° de contrat</label><input type="text" id="champ-contrat-assurance-chasseur"></div>
            </div>
            <label class="etiquette">Assurance valable jusqu'au</label><input type="date" id="champ-validite-assurance-chasseur">
            <label class="etiquette"><input type="checkbox" id="champ-actif-chasseur" checked> Membre actif</label>
            <div class="actions-modale">
                <button type="button" class="bouton bouton-secondaire" onclick="fermerModale('modale-chasseur')">Annuler</button>
                <button type="submit" class="bouton bouton-principal">Enregistrer</button>
            </div>
        </form>
    </div>
</div>

<!-- Modale Plan de chasse -->
<div class="fond-modale" id="modale-plan">
    <div class="boite-modale">
        <h2>Attribution</h2>
        <div id="message-modale-plan"></div>
        <form id="formulaire-plan">
            <label class="etiquette">Saison *</label><input type="text" id="champ-saison-plan" required>
            <label class="etiquette">Espèce *</label><select id="champ-espece-plan" required></select>
            <label class="etiquette">Attribution</label><input type="number" min="0" id="champ-attribution-plan">
            <div class="actions-modale">
                <button type="button" class="bouton bouton-secondaire" onclick="fermerModale('modale-plan')">Annuler</button>
                <button type="submit" class="bouton bouton-principal">Enregistrer</button>
            </div>
        </form>
    </div>
</div>

<!-- Modale Battue -->
<div class="fond-modale" id="modale-battue">
    <div class="boite-modale" style="max-width:640px;">
        <h2 id="titre-modale-battue">Battue</h2>
        <div id="message-modale-battue"></div>
        <form id="formulaire-battue">
            <div class="ligne-champs">
                <div><label class="etiquette">Date *</label><input type="date" id="champ-date-battue" required></div>
                <div><label class="etiquette">Secteur</label><input type="text" id="champ-secteur-battue"></div>
            </div>
            <div class="ligne-champs">
                <div><label class="etiquette">Parcelle</label><select id="champ-parcelle-battue"></select></div>
                <div><label class="etiquette">Responsable</label><select id="champ-responsable-battue"></select></div>
            </div>
            <div class="ligne-champs">
                <div><label class="etiquette">Lieu de rendez-vous</label><input type="text" id="champ-lieu-rdv-battue"></div>
                <div><label class="etiquette">Heure de rendez-vous</label><input type="time" id="champ-heure-rdv-battue"></div>
            </div>

            <label class="etiquette">Places de parking (clique sur la carte pour en ajouter)</label>
            <div class="controles-fond-carte">
                <button type="button" id="bouton-fond-plan-battue" class="bouton bouton-secondaire">Plan IGN</button>
                <button type="button" id="bouton-fond-satellite-battue" class="bouton bouton-secondaire">Satellite</button>
            </div>
            <div id="carte-battue" class="conteneur-carte" style="height:280px;"></div>
            <div id="liste-parkings" style="margin-top:8px; font-size:13px;"></div>

            <label class="etiquette">Participants</label>
            <div id="liste-participants-cochables" class="carte" style="max-height:160px; overflow-y:auto; padding:10px;"></div>

            <label class="etiquette">Règles de sécurité</label>
            <textarea id="champ-securite-battue" rows="4"></textarea>

            <label class="etiquette">Instructions</label>
            <textarea id="champ-instructions-battue" rows="3"></textarea>

            <label class="etiquette">Notes</label>
            <textarea id="champ-notes-battue" rows="2"></textarea>

            <div class="actions-modale">
                <button type="button" class="bouton bouton-secondaire" onclick="fermerModale('modale-battue')">Annuler</button>
                <button type="submit" class="bouton bouton-principal">Enregistrer</button>
            </div>
        </form>
    </div>
</div>

<!-- Modale Prélèvement -->
<div class="fond-modale" id="modale-prelevement">
    <div class="boite-modale">
        <h2>Prélèvement</h2>
        <div id="message-modale-prelevement"></div>
        <form id="formulaire-prelevement">
            <div class="ligne-champs">
                <div><label class="etiquette">Date *</label><input type="date" id="champ-date-prelevement" required></div>
                <div><label class="etiquette">Saison *</label><input type="text" id="champ-saison-prelevement" required></div>
            </div>
            <label class="etiquette">Espèce *</label><select id="champ-espece-prelevement" required></select>
            <label class="etiquette">Chasseur</label><select id="champ-chasseur-prelevement"></select>
            <label class="etiquette">Battue</label><select id="champ-battue-prelevement"></select>
            <div class="ligne-champs">
                <div>
                    <label class="etiquette">Sexe</label>
                    <select id="champ-sexe-prelevement">
                        <option>Indéterminé</option><option>Mâle</option><option>Femelle</option>
                    </select>
                </div>
                <div><label class="etiquette">Poids (kg)</label><input type="number" step="0.1" min="0" id="champ-poids-prelevement"></div>
            </div>
            <div class="actions-modale">
                <button type="button" class="bouton bouton-secondaire" onclick="fermerModale('modale-prelevement')">Annuler</button>
                <button type="submit" class="bouton bouton-principal">Enregistrer</button>
            </div>
        </form>
    </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/mode-demo.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/modales.js"></script>
<script src="../js/onglets.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/fonds-carte.js"></script>
<script src="../js/chasse.js"></script>
</body>
</html>
